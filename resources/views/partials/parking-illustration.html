<div class="parking-illustration-wrapper">

<title>Ilustrasi area parkir animasi</title>
<desc>Animasi kendaraan masuk area parkir dengan slot tersedia</desc>
<defs>
  <style>
    .pi-ground { fill: #0f0f1e; }
    .pi-slot-filled { fill: #1a1a3e; stroke: #4f46e555; stroke-width: 1; }
    .pi-slot-available { fill: #0d2a1a; stroke: #22c55e; stroke-width: 2; stroke-dasharray: 7 4; }
    .pi-road { fill: #1e1e30; }
    .pi-panel { fill: #0d0d1f; }
    .pi-stat-card { fill: #1a1a3e; }
    .pi-label { fill: #94a3b8; font-family: sans-serif; font-size: 10px; }

    @keyframes pi-car-park {
      0%   { transform: translateX(700px) translateY(0); }
      55%  { transform: translateX(290px) translateY(0); }
      70%  { transform: translateX(290px) translateY(0); }
      85%  { transform: translateX(290px) translateY(-62px); }
      90%  { transform: translateX(290px) translateY(-62px); }
      95%  { transform: translateX(700px) translateY(-62px); }
      100% { transform: translateX(700px) translateY(-62px); }
    }
    @keyframes pi-blink {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.35; }
    }
    @keyframes pi-badge-float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-5px); }
    }
    @keyframes pi-moto-idle {
      0%,100% { transform: translateY(0px); }
      50%     { transform: translateY(-2px); }
    }
    @keyframes pi-dot-pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%     { opacity: 0.5; transform: scale(1.4); }
    }
    @keyframes pi-arrow-fade {
      0%,100% { opacity: 0.6; }
      50%     { opacity: 0.15; }
    }

    .pi-car-anim {
      animation: pi-car-park 4s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    .pi-slot-blink { animation: pi-blink 1.4s ease-in-out infinite; }
    .pi-slot-blink-delay { animation: pi-blink 1.4s ease-in-out 0.7s infinite; }
    .pi-badge-float { animation: pi-badge-float 2.5s ease-in-out infinite; }
    .pi-moto-idle { animation: pi-moto-idle 2s ease-in-out infinite; }
    .pi-dot-pulse { animation: pi-dot-pulse 1.8s ease-in-out infinite; }
    .pi-arrow-fade { animation: pi-arrow-fade 2s ease-in-out infinite; }
  </style>
  <marker id="pi-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <clipPath id="pi-clip">
    <rect x="40" y="30" width="600" height="420" rx="16"/>
  </clipPath>
</defs>
